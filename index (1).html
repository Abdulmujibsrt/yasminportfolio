<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitrah Yasmin Bakhitah — Portfolio</title>
<meta name="description" content="Portofolio Fitrah Yasmin Bakhitah, S1 Pendidikan IPS Universitas Negeri Surabaya.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ind:#17143B;--pur:#6545E8;--cy:#20C9F5;--pk:#FF5CA8;--vi:#A98BFF;--wh:#F8FAFF;
--g1:rgba(255,255,255,.10);--g2:rgba(255,255,255,.16);--bd:rgba(255,255,255,.22);--blur:24px;
--hf:'Space Grotesk',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font:400 1rem/1.65 var(--bf);color:var(--wh);background:var(--ind);overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
radial-gradient(60% 50% at 85% 5%,rgba(101,69,232,.75),transparent 70%),
radial-gradient(45% 40% at 5% 35%,rgba(32,201,245,.28),transparent 70%),
radial-gradient(50% 45% at 90% 75%,rgba(255,92,168,.30),transparent 70%),
radial-gradient(60% 50% at 20% 100%,rgba(101,69,232,.55),transparent 70%),var(--ind)}
.orb{position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;opacity:.5;animation:fl 18s ease-in-out infinite alternate;pointer-events:none}
.o1{width:340px;height:340px;background:var(--cy);top:8%;left:-120px;opacity:.28}
.o2{width:300px;height:300px;background:var(--pk);bottom:6%;right:-90px;opacity:.3;animation-delay:-6s}
.o3{width:220px;height:220px;background:var(--pur);top:48%;left:55%;animation-delay:-11s}
@keyframes fl{to{transform:translate(40px,-50px) scale(1.12)}}
a{color:inherit}
.wrap{width:min(1120px,92%);margin:auto}
section{padding:6rem 0 2rem}
h1,h2,h3{font-family:var(--hf);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(2rem,4.4vw,3.2rem);margin-bottom:.6rem}
.sub{color:rgba(248,250,255,.78);max-width:56ch;margin-bottom:2.4rem}
.grad{background:linear-gradient(95deg,var(--cy),var(--vi) 50%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--g1);border:1px solid var(--bd);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
box-shadow:0 8px 32px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.28);border-radius:22px;transition:transform .35s,border-color .35s,background .35s}
.lift:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.5);background:var(--g2)}
/* nav */
header{position:fixed;top:12px;left:0;right:0;z-index:50}
nav{width:min(1120px,94%);margin:auto;display:flex;align-items:center;gap:.4rem;padding:.55rem .7rem .55rem 1.2rem;border-radius:999px}
.logo{font:700 1.05rem var(--hf);text-decoration:none;margin-right:auto}
.links{display:flex;gap:.1rem;position:relative}
.links a{position:relative;padding:.45rem .8rem;font-size:.88rem;text-decoration:none;color:rgba(248,250,255,.8);border-radius:999px;transition:color .2s}
.links a.on{color:#fff}
.links a.on::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--pk));box-shadow:0 0 10px var(--cy)}
.lang{display:flex;border:1px solid var(--bd);border-radius:999px;padding:2px;margin-left:.5rem}
.lang button{border:0;background:none;color:var(--wh);font:600 .78rem var(--bf);padding:.35rem .7rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:linear-gradient(135deg,var(--pur),var(--pk))}
.burger{display:none;background:none;border:1px solid var(--bd);color:#fff;border-radius:12px;width:44px;height:40px;font-size:1.2rem;cursor:pointer;margin-left:.4rem}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.5rem;border-radius:999px;font:600 .95rem var(--bf);text-decoration:none;border:1px solid var(--bd);color:#fff;cursor:pointer;transition:transform .25s,box-shadow .25s,background-position .4s}
.btn.pri{border:0;background:linear-gradient(110deg,var(--pur),var(--pk),var(--cy));background-size:200% 100%;box-shadow:0 8px 28px rgba(101,69,232,.55)}
.btn.pri:hover{background-position:100% 0;transform:translateY(-3px);box-shadow:0 12px 36px rgba(255,92,168,.5)}
.btn.sec{background:var(--g1);backdrop-filter:blur(16px)}
.btn.sec:hover{transform:translateY(-3px);border-color:#fff;background:var(--g2)}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
/* hero */
#home{min-height:100vh;display:flex;align-items:center;padding:7rem 0 3rem}
.hero{display:grid;grid-template-columns:1.25fr .85fr;gap:3rem;align-items:center}
.hero h1{font-size:clamp(2.8rem,7.4vw,6rem);margin:.8rem 0 1.2rem}
.role{display:inline-block;padding:.4rem 1rem;border-radius:999px;font-size:.85rem}
.hero p{max-width:50ch;color:rgba(248,250,255,.85);font-size:1.08rem}
.cta{display:flex;flex-wrap:wrap;gap:.9rem;margin:2rem 0 1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{padding:.5rem .95rem;border-radius:14px;font-size:.85rem}
.chip b{font-family:var(--hf);color:var(--cy);font-size:1.1rem;margin-right:.35rem}
.portrait{position:relative;justify-self:center;width:min(380px,82%)}
.portrait .frame{padding:12px;border-radius:200px 200px 32px 32px;box-shadow:0 20px 70px rgba(101,69,232,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.portrait img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:190px 190px 22px 22px}
.float{position:absolute;padding:.7rem 1rem;border-radius:16px;font-size:.82rem;animation:bob 6s ease-in-out infinite alternate}
.f1{left:-12%;bottom:14%}.f2{right:-8%;top:10%;animation-delay:-3s}
.float b{display:block;font:700 1.25rem var(--hf)}
@keyframes bob{to{transform:translateY(-14px)}}
/* about */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:1.4rem}
.about .big{padding:2.2rem;font:500 clamp(1.3rem,2.4vw,1.75rem)/1.4 var(--hf)}
.facts{padding:1.8rem;display:grid;gap:1rem;align-content:center}
.facts div span{display:block;font-size:.78rem;color:var(--vi)}
/* timeline */
.tl{position:relative;padding-left:2.2rem;display:grid;gap:1.2rem}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--cy),var(--pur),var(--pk));box-shadow:0 0 14px var(--pur)}
.tl article{position:relative;padding:1.5rem 1.7rem}
.tl article::before{content:"";position:absolute;left:-2.2rem;top:1.9rem;width:19px;height:19px;border-radius:50%;background:var(--ind);border:3px solid var(--cy);box-shadow:0 0 0 4px rgba(32,201,245,.2),0 0 16px var(--cy);transition:.3s}
.tl article:hover::before{background:var(--cy);border-color:var(--pk);box-shadow:0 0 0 6px rgba(255,92,168,.25),0 0 22px var(--pk)}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.3rem 1rem;align-items:baseline;margin-bottom:.6rem}
.hd h3{font-size:1.3rem}.date{font-size:.85rem;color:var(--cy);font-weight:600}
.who{color:var(--vi);font-size:.92rem;margin-bottom:.5rem}
ul.ls{list-style:none;padding:0;display:grid;gap:.45rem}
ul.ls li{padding-left:1.3rem;position:relative;color:rgba(248,250,255,.9)}
ul.ls li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--pk)}
/* education */
.edu{display:grid;grid-template-columns:1.4fr 1fr;gap:1.4rem}
.edu .main{padding:2.2rem}.edu .main h3{font-size:1.7rem;margin:.6rem 0 .3rem}
.gpa{padding:2rem;text-align:center;display:grid;place-content:center;background:linear-gradient(145deg,rgba(101,69,232,.5),rgba(255,92,168,.28));border-color:rgba(255,255,255,.4)}
.gpa strong{font:700 clamp(4rem,9vw,6.4rem)/1 var(--hf)}
/* internship + org */
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.card{padding:1.8rem}
.card.a{background:linear-gradient(160deg,rgba(32,201,245,.2),var(--g1))}
.card.b{background:linear-gradient(160deg,rgba(255,92,168,.2),var(--g1))}
.org{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4rem}
/* skills */
.sk{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.sk .glass{padding:1.8rem}.sk h3{margin-bottom:1.1rem;font-size:1.25rem}
.tags{display:flex;flex-wrap:wrap;gap:.6rem}
.tag{padding:.5rem 1rem;border-radius:999px;font-size:.9rem;border:1px solid var(--bd);background:rgba(255,255,255,.08);transition:.25s}
.tag:hover{background:linear-gradient(120deg,var(--pur),var(--pk));border-color:transparent;transform:translateY(-2px)}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem}
.gal button{padding:10px;cursor:pointer;color:inherit;font:inherit;text-align:left}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
.gal span{display:block;padding:.7rem .3rem .2rem;font-size:.9rem}
.empty{padding:2rem;text-align:center;border-style:dashed}
.empty code{background:rgba(0,0,0,.25);padding:.1rem .4rem;border-radius:6px;color:var(--cy)}
#lb{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(14,11,42,.82);backdrop-filter:blur(10px);padding:1rem}
#lb.open{display:grid}
#lb figure{max-width:min(960px,96vw);text-align:center}
#lb img{max-width:100%;max-height:78vh;border-radius:16px;border:1px solid var(--bd)}
#lb figcaption{margin-top:.8rem}
#lb .x,#lb .nv{position:absolute;border:1px solid var(--bd);background:var(--g2);color:#fff;border-radius:50%;width:48px;height:48px;font-size:1.4rem;cursor:pointer}
#lb .x{top:1rem;right:1rem}#lb .p{left:1rem;top:50%}#lb .n{right:1rem;top:50%}
/* contact */
#contact{padding-bottom:5rem}
.ct{padding:clamp(2rem,5vw,4rem);text-align:center;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(101,69,232,.5),rgba(255,92,168,.28) 55%,rgba(32,201,245,.3))}
.ct h2{font-size:clamp(2.2rem,5.5vw,4rem)}
.ct .sub{margin-inline:auto}
.ct .cta{justify-content:center}
.info{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:1rem}
.info a,.info span{padding:.5rem 1rem;border-radius:14px;font-size:.88rem;text-decoration:none}
footer{text-align:center;padding:1.5rem;color:rgba(248,250,255,.6);font-size:.85rem}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(max-width:900px){
.hero,.about,.edu,.two,.org,.sk{grid-template-columns:1fr}
.portrait{order:-1;width:min(300px,70%)}.f1{left:-6%}.f2{right:-4%}
.burger{display:block}
.links{display:none;position:absolute;top:calc(100% + 8px);left:3%;right:3%;flex-direction:column;padding:.8rem;border-radius:22px;background:rgba(23,20,59,.92);border:1px solid var(--bd)}
.links.open{display:flex}.links a{padding:.8rem 1rem}.links a.on::after{left:1rem;right:auto;width:28px;bottom:6px}
.glass{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.o3{display:none}.orb{filter:blur(40px)}
section{padding-top:4.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
#tabs{display:none}
@media(max-width:900px){
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{top:max(8px,env(safe-area-inset-top))}nav{padding:.4rem .5rem .4rem 1rem}
.burger,.links{display:none!important}.lang{margin-left:0}.lang button{min-height:38px;padding:.3rem .85rem}
#tabs{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;padding:.3rem;border-radius:26px;background:rgba(23,20,59,.72)}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;font-size:.68rem;text-decoration:none;color:rgba(248,250,255,.72);border-radius:20px;transition:.25s}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs a.on{color:#fff;background:linear-gradient(135deg,rgba(101,69,232,.85),rgba(255,92,168,.55));box-shadow:0 0 16px rgba(101,69,232,.6)}
section{padding:3.2rem 0 .6rem}h2{font-size:1.7rem}.sub{font-size:.92rem;margin-bottom:1.2rem}
.glass{border-radius:18px}
#home{min-height:auto;padding:5.2rem 0 1rem}.hero{gap:1.1rem}
.portrait{width:min(250px,64vw)}
.hero>div:first-child{text-align:center}
.hero h1{font-size:clamp(2.2rem,10.5vw,3rem);margin:.6rem 0 .8rem}
.hero p{font-size:.95rem;margin-inline:auto}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.2rem 0 1rem}
.btn{justify-content:center;padding:.8rem .6rem;font-size:.9rem;min-height:48px}
.chips{justify-content:center}.chip{padding:.4rem .8rem;font-size:.78rem}
.float{padding:.45rem .7rem;font-size:.7rem}.float b{font-size:1rem}
.about .big{padding:1.3rem;font-size:1.08rem}.facts{padding:1.2rem}
.tl{padding-left:1.7rem}.tl::before{left:5px}.tl article{padding:1.1rem}.tl article::before{left:-1.7rem;top:1.4rem;width:15px;height:15px}
.hd h3{font-size:1.05rem}ul.ls{font-size:.9rem}
.edu{grid-template-columns:1.35fr 1fr;gap:.8rem}.edu .main{padding:1.2rem}.edu .main h3{font-size:1.15rem}.gpa{padding:1rem}.gpa strong{font-size:3.4rem}
#int,#org{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.8rem;margin:0 -4%;padding:.3rem 4% 1rem;scrollbar-width:none}
#int>*,#org>*{flex:0 0 84%;scroll-snap-align:center}
.sk .glass{padding:1.2rem}.tag{font-size:.82rem;padding:.45rem .8rem}
.gal{grid-template-columns:repeat(2,1fr);gap:.7rem}
.ct{padding:1.8rem 1.2rem}.ct .cta{grid-template-columns:1fr}
}
</style>
</head>
